<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b201f">
  <title>Beneath the Lilies · Foobow</title>
  <link rel="stylesheet" href="dive.css">
</head>
<body>
  <main class="pond" data-stage="entry">
    <div class="art" aria-hidden="true"></div>
    <div id="pond" class="water" role="region" tabindex="0" aria-label="Interactive koi pond" aria-describedby="instructions" data-view="surface" hidden></div>
    <header class="top">
      <a id="back" href="../">← Sanctuary</a>
      <div class="settings">
        <button id="sound" type="button" aria-pressed="false">Sound off</button>
        <button id="language" type="button" lang="zh-Hans">中文</button>
      </div>
    </header>
    <section class="entry" aria-labelledby="title">
      <h1 id="title">Beneath<br>the Lilies</h1>
      <p id="intro">Release a koi into a quiet virtual pond and see the water through its eyes.</p>
      <button id="release" class="primary" type="button" disabled>Release the koi</button>
      <a id="fallback" class="primary" href="../" hidden>Play the illustrated pond</a>
      <noscript><a class="primary" href="../">Return to Sanctuary</a></noscript>
    </section>
    <section id="controls" class="controls" aria-label="Pond controls" hidden>
      <div class="actions">
        <div class="views" role="group" aria-label="Camera view">
          <button id="surface" type="button" aria-pressed="true">Surface</button>
          <button id="koi" type="button" aria-pressed="false">Koi view</button>
        </div>
        <button id="pause" type="button">Pause motion</button>
      </div>
      <p id="instructions">Move your pointer or touch the water to guide. With the pond focused, use arrow keys.</p>
    </section>
    <p id="status" class="status" role="status">Preparing the pond…</p>
  </main>
  <script type="module" src="dive.mjs"></script>
</body>
</html>
